<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Character GLB test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#1b1d22;color:#e8e8ea;font:13px/1.4 system-ui,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#panel{overflow:auto;padding:12px;border-right:1px solid #333}
#view{position:relative}canvas{display:block}
h2{font-size:13px;margin:14px 0 6px;color:#9ad}
button{background:#2c313a;color:#eee;border:1px solid #444;border-radius:4px;padding:4px 8px;margin:2px;cursor:pointer}
button.on{background:#3d6fb5}
.row{display:grid;grid-template-columns:150px 1fr 38px;align-items:center;gap:6px}
.row input{width:100%}
pre{white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace;background:#111;padding:8px;border-radius:4px;max-height:320px;overflow:auto}
.pass{color:#7d7}.fail{color:#f77}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="app"><div id="panel">
<div id="status">Loading AAdi.glb ...</div>
<h2>Automated checks</h2><button id="rerun">Run checks again</button><pre id="results">waiting</pre>
<h2>Animation clips</h2><div id="clips"></div>
<h2>Procedural layer (plain JS on bones)</h2><div id="bones"></div>
<button id="blink">Auto blink</button><button id="talk">Talk (jaw + lips)</button><button id="resetAll">Reset</button>
<h2>ARKit morph targets (52)</h2><div id="morphs"></div>
</div><div id="view"></div></div>
<script type="module" src="./main.js"></script></body></html>
